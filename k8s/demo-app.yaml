apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: observability
  labels:
    app: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
      annotations:
        # Mismo patron que boxful-tracking/kubernetes/prd/deployment.yml
        # (inject-nodejs: "true") pero para Python. El Operator busca el CR
        # Instrumentation en el mismo namespace automaticamente.
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      containers:
        - name: demo-app
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --no-cache-dir flask && \
              python app.py
          workingDir: /app
          ports:
            - containerPort: 5000
          env:
            - name: OTEL_SERVICE_NAME
              value: demo-app
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: app-code
              mountPath: /app
      volumes:
        - name: app-code
          configMap:
            name: demo-app-code
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-code
  namespace: observability
data:
  app.py: |
    from flask import Flask
    import random, time

    app = Flask(__name__)

    @app.route("/")
    def home():
        time.sleep(random.uniform(0.05, 0.3))
        return "ok"

    @app.route("/health")
    def health():
        return "healthy"

    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=5000)
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: observability
spec:
  selector:
    app: demo-app
  ports:
    - port: 80
      targetPort: 5000
