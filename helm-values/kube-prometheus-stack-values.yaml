grafana:
  adminPassword: admin
  additionalDataSources:
    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo.observability.svc.cluster.local:3100
      isDefault: false

prometheus:
  prometheusSpec:
    additionalScrapeConfigs:
      - job_name: otel-collector
        static_configs:
          - targets: ["otel-collector-collector.observability.svc.cluster.local:8889"]
