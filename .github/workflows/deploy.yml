name: Deploy EKS Infra + Observability Stack

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: demo-eks-observability

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    outputs:
      otel_collector_role_arn: ${{ steps.tf_outputs.outputs.otel_collector_role_arn }}
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC token claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString());
            core.info(`iss=${payload.iss}`);
            core.info(`aud=${payload.aud}`);
            core.info(`sub=${payload.sub}`);

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init

      - run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan
          terraform show -no-color tfplan > plan_output.txt
        continue-on-error: true

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan_output.txt', 'utf8');
            const maxLen = 60000;
            const body = plan.length > maxLen ? plan.slice(0, maxLen) + '\n\n... (truncado)' : plan;

            const output = `#### Terraform Plan \`${{ steps.plan.outcome }}\`
            <details><summary>Ver plan completo</summary>

            \`\`\`terraform
            ${body}
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan

      - name: Export Terraform outputs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: tf_outputs
        run: echo "otel_collector_role_arn=$(terraform output -raw otel_collector_role_arn)" >> "$GITHUB_OUTPUT"

  deploy-app:
    needs: terraform
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy observability stack
        env:
          OTEL_COLLECTOR_ROLE_ARN: ${{ needs.terraform.outputs.otel_collector_role_arn }}
        run: |
          envsubst < k8s/otel-collector.yaml | kubectl apply -f -
          kubectl apply -f k8s/demo-app.yaml
          kubectl rollout status deployment/demo-app -n observability --timeout=180s
